<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Performance Predictor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:white;
    padding:40px;
}


/* Glass Card */
.card{
    width:100%;
    max-width:900px;
    padding:50px;
    border-radius:25px;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 25px 50px rgba(0,0,0,0.6);
    text-align:center;
    animation:fadeUp 0.8s ease;
}


@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    margin-bottom:30px;
    font-weight:600;
    letter-spacing:0.5px;
}

/* Inputs */
input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
    transition:0.3s;
}

input::placeholder{
    color:#cfcfcf;
}

input:focus{
    background:rgba(0,255,255,0.15);
    box-shadow:0 0 10px rgba(0,255,255,0.4);
    transform:scale(1.03);
}

/* Button */
button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background: linear-gradient(135deg,#00f2fe,#4facfe);
    color:white;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

/* Result Card */
.result-card{
    margin-top:25px;
    padding:18px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    animation:pop 0.4s ease;
}

@keyframes pop{
    from{transform:scale(0.9); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

/* Status Colors */
.pass-text{
    color:#00ffb3;
    font-weight:bold;
    text-shadow:0 0 10px rgba(0,255,179,0.6);
}

.fail-text{
    color:#ff4d6d;
    font-weight:bold;
    text-shadow:0 0 10px rgba(255,77,109,0.6);
}

/* Error */
.error{
    background:linear-gradient(135deg,#ff9a00,#ffcc00);
    color:black;
}
</style>
</head>

<body>

<div class="card">

<h2>🎓 AI Student Performance Predictor</h2>

<form action="/predict" method="post">
    <input type="number" name="G2" placeholder="G2 Marks (0-20)" required>
    <input type="number" name="G1" placeholder="G1 Marks (0-20)" required>
    <input type="number" name="absences" placeholder="Absences (0-93)" required>
    <input type="number" name="failures" placeholder="Failures" required>
    <input type="number" name="studytime" placeholder="Study Time (Hours)" required>

    <button type="submit">Predict Performance</button>
</form>

{% if prediction_text %}
<div class="result-card">
    <h3>Predicted Marks: {{ prediction_text }}</h3>
    <h3 class="{{ status_class }}">Status: {{ result }}</h3>
</div>
{% endif %}

{% if error_message %}
<div class="result-card error">
    <h3>{{ error_message }}</h3>
</div>
{% endif %}

{% if show_popup and error_message %}
<script>
    alert("{{ error_message }}");
</script>
{% endif %}


</div>

</body>
</html>
