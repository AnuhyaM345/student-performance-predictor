<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Performance Predictor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:white;
}

/* Glass Card */
.card{
    width:100%;
    max-width:500px;
    padding:50px;
    border-radius:25px;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 25px 50px rgba(0,0,0,0.6);
    text-align:center;
    animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    margin-bottom:30px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
    transition:0.3s;
}

input::placeholder{
    color:#cfcfcf;
}

input:focus{
    background:rgba(0,255,255,0.15);
    box-shadow:0 0 10px rgba(0,255,255,0.4);
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    background: linear-gradient(135deg,#00f2fe,#4facfe);
    color:white;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

.result-card{
    margin-top:25px;
    padding:18px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    animation:pop 0.4s ease;
}

@keyframes pop{
    from{transform:scale(0.9); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

.pass-text{
    color:#00ffb3;
    font-weight:bold;
}

.fail-text{
    color:#ff4d6d;
    font-weight:bold;
}

/* Toast Popup */
.toast{
    position: fixed;
    top: 25px;
    right: 25px;
    background: linear-gradient(135deg,#ff416c,#ff4b2b);
    color:white;
    padding:16px 22px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    opacity:0;
    transform: translateY(-20px);
    transition: all 0.4s ease;
    z-index:9999;
    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div class="card">

<h2>Student Performance Predictor</h2>

<form action="/predict" method="post">
    <input type="number" name="G2" placeholder="G2 Marks (0-20)" required>
    <input type="number" name="G1" placeholder="G1 Marks (0-20)" required>
    <input type="number" name="absences" placeholder="Absences (0-93)" required>
    <input type="number" name="failures" placeholder="Failures" required>
    <input type="number" name="studytime" placeholder="Study Time (Hours)" required>

    <button type="submit">Predict Performance</button>
</form>

{% if prediction_text %}
<div class="result-card">
    <h3>Predicted Marks: {{ prediction_text }}</h3>
    <h3 class="{{ status_class }}">Status: {{ result }}</h3>
</div>
{% endif %}

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

{% if error_message %}
<script>
const toast = document.getElementById("toast");
toast.innerText = "{{ error_message }}";
toast.classList.add("show");

setTimeout(()=>{
    toast.classList.remove("show");
},3500);
</script>
{% endif %}

</body>
</html>
